<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="店铺看板">
<meta name="theme-color" content="#1a1a2e">
<title>店铺指标看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{font-size:14px;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:#f0f2f5;overflow-x:hidden;color:#333;line-height:1.5}

/* ===== 侧边栏 ===== */
.sidebar{
  position:fixed;top:0;left:0;width:220px;height:100vh;
  background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  z-index:1000;
  -webkit-transform:translateX(-100%);transform:translateX(-100%);
  transition:-webkit-transform .3s ease;transition:transform .3s ease;transition:transform .3s ease,-webkit-transform .3s ease;
}
.sidebar.open{-webkit-transform:translateX(0);transform:translateX(0)}
.sidebar-header{
  position:-webkit-sticky;position:sticky;top:0;
  background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);
  padding:16px 14px 12px;border-bottom:1px solid rgba(255,255,255,.08);
  z-index:10;
}
.sidebar-header h2{color:#fff;font-size:16px;font-weight:700;margin-bottom:4px}
.sidebar-header .date{color:rgba(255,255,255,.5);font-size:11px}
.sidebar-group-title{
  color:rgba(255,255,255,.35);font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;
  padding:14px 16px 6px;
}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 16px 9px 18px;color:rgba(255,255,255,.75);font-size:13px;
  cursor:pointer;border-left:3px solid transparent;
  transition:background .2s,color .2s;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{
  background:rgba(255,255,255,.12);color:#fff;
  border-left:3px solid #4a90d9;
}
.nav-item .nav-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.nav-item .nav-amt{font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap;margin-left:6px;flex-shrink:0}
.nav-item.active .nav-amt{color:rgba(255,255,255,.7)}

/* ===== 遮罩 ===== */
.overlay{
  display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:rgba(0,0,0,.5);z-index:999;
}
.overlay.show{display:block}

/* ===== 顶部栏 ===== */
.topbar{
  position:-webkit-sticky;position:sticky;top:0;z-index:100;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  padding:12px 16px;display:flex;align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.hamburger{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;background:rgba(255,255,255,.1);
  border:none;border-radius:8px;cursor:pointer;margin-right:12px;
  flex-shrink:0;
}
.hamburger span{display:block;width:18px;height:2px;background:#fff;border-radius:1px;position:relative}
.hamburger span:before,.hamburger span:after{content:'';position:absolute;left:0;width:18px;height:2px;background:#fff;border-radius:1px}
.hamburger span:before{top:-6px}
.hamburger span:after{top:6px}
.topbar h1{color:#fff;font-size:17px;font-weight:700;flex:1}
.topbar .topbar-date{color:rgba(255,255,255,.6);font-size:12px;white-space:nowrap}

/* ===== 主内容区 ===== */
.main-content{padding:16px;min-height:calc(100vh - 60px)}

/* ===== KPI卡片 ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.kpi-card{
  background:#fff;border-radius:10px;padding:14px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
  cursor:pointer;transition:transform .2s,box-shadow .2s;
  border:1px solid rgba(0,0,0,.03);
}
.kpi-card:hover{-webkit-transform:translateY(-2px);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.kpi-label{font-size:11px;color:#888;margin-bottom:6px;font-weight:500}
.kpi-value{font-size:20px;font-weight:700;color:#1a1a2e;word-break:break-all}
.kpi-value .unit{font-size:13px;font-weight:500;color:#666;margin-left:2px}

/* ===== Section标题 ===== */
.section-title{
  font-size:15px;font-weight:600;color:#1a1a2e;margin:20px 0 12px;
  padding-left:10px;position:relative;
}
.section-title:before{
  content:'';position:absolute;left:0;top:50%;
  -webkit-transform:translateY(-50%);transform:translateY(-50%);
  width:3px;height:16px;background:#4a90d9;border-radius:2px;
}

/* ===== 图表区 ===== */
.chart-container{
  background:#fff;border-radius:10px;padding:14px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px;
}
.chart-container h3{font-size:14px;font-weight:600;color:#333;margin-bottom:10px}
.chart-wrapper{position:relative;height:240px}
.chart-tip{font-size:11px;color:#999;margin-top:8px;text-align:center}

/* ===== 表格 ===== */
.table-container{
  background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:20px;
}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:600px;font-size:12px;table-layout:auto}
th{padding:10px 8px;text-align:center;font-weight:600;color:#555;white-space:nowrap;border-bottom:2px solid #e8eaed;position:sticky;top:0;background:#f5f7fa;z-index:1}
td{padding:8px;border-bottom:1px solid #f0f0f0;white-space:nowrap;text-align:center}
td:nth-child(n+3){text-align:center}
td:nth-child(2){text-align:center}
tbody tr:hover{background:#f9f9fb}
.store-link{color:#0f3460;font-weight:600;cursor:pointer;text-decoration:none}
.store-link:hover{color:#1a73e8;text-decoration:underline}

@media(max-width:768px){
  table{min-width:auto;font-size:10px}
  th{padding:6px 4px}
  td{padding:5px 4px}
  .handle-btn{padding:2px 6px;font-size:10px}
  .rank-badge{width:16px;height:16px;font-size:9px}
  .tag{padding:1px 6px;font-size:9px}
}

/* ===== 排名徽章 ===== */
.rank-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;
}
.rank-1{background:#ffd700;color:#5a4500}
.rank-2{background:#c0c0c0;color:#333}
.rank-3{background:#cd7f32}
.rank-other{background:#e0e0e0;color:#666}

/* ===== 标签 ===== */
.tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:11px;font-weight:600}
.tag-red{background:#ffe0e0;color:#d32f2f}
.tag-green{background:#e0f5e0;color:#2e7d32}
.tag-orange{background:#fff3e0;color:#ef6c00}

/* ===== 店铺详情页 ===== */
.store-detail{display:none;animation:fadeIn .3s ease}
.store-detail.active{display:block}
@keyframes fadeIn{from{opacity:0;-webkit-transform:translateY(8px);transform:translateY(8px)}to{opacity:1;-webkit-transform:translateY(0);transform:translateY(0)}}
.store-detail h2{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:16px}
.store-detail h3{font-size:15px;font-weight:600;color:#1a1a2e;margin:16px 0 12px;padding-left:10px;position:relative}
.store-detail h3:before{content:'';position:absolute;left:0;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%);width:3px;height:16px;background:#4a90d9;border-radius:2px}
.detail-kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.detail-kpi-card{background:#fff;border-radius:10px;padding:12px 10px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.03)}
.detail-kpi-label{font-size:11px;color:#888;margin-bottom:4px}
.detail-kpi-value{font-size:18px;font-weight:700;color:#1a1a2e;word-break:break-all}
.detail-kpi-value .unit{font-size:12px;font-weight:500;color:#666;margin-left:2px}
.owner-field{font-size:16px;font-weight:600;color:#1a1a2e}

/* ===== AI聊天框 ===== */
.chat-fab{
  position:fixed;right:16px;bottom:16px;z-index:500;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#4a90d9,#0f3460);
  border:none;cursor:grab;color:#fff;font-size:24px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s,opacity .2s;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.chat-fab:active{cursor:grabbing}
.chat-fab.dragging{transition:none}
.chat-fab:hover{-webkit-transform:scale(1.08);transform:scale(1.08)}
.chat-fab.hidden{opacity:0;pointer-events:none;-webkit-transform:scale(0);transform:scale(0)}

.chat-panel{
  position:fixed;right:16px;bottom:16px;z-index:501;
  width:calc(100vw - 32px);max-width:380px;
  height:520px;max-height:calc(100vh - 32px);
  background:#fff;border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.2);
  display:none;flex-direction:column;overflow:hidden;
  animation:chatSlideUp .25s ease;
}
.chat-header{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.chat-header:active{cursor:grabbing}
@keyframes chatSlideUp{from{opacity:0;-webkit-transform:translateY(20px);transform:translateY(20px)}to{opacity:1;-webkit-transform:translateY(0);transform:translateY(0)}}
.chat-panel.show{display:flex}

.chat-header{
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.chat-header .chat-title{font-size:15px;font-weight:700}
.chat-header .chat-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.chat-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.chat-close:hover{background:rgba(255,255,255,.25)}

.chat-messages{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 12px;display:flex;flex-direction:column;gap:10px;
  background:#f7f8fa;
}
.chat-msg{max-width:85%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.chat-msg.ai{background:#fff;color:#333;align-self:flex-start;border:1px solid #e8eaed;border-bottom-left-radius:4px}
.chat-msg.user{background:linear-gradient(135deg,#4a90d9,#0f3460);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-msg.loading{color:#999;font-style:italic}
.chat-msg.error{background:#ffe0e0;color:#d32f2f;border:1px solid #ffcdd2}

.chat-input-area{
  flex-shrink:0;padding:10px 12px;border-top:1px solid #e8eaed;background:#fff;
  display:flex;gap:8px;
}
.chat-input{
  flex:1;border:1px solid #ddd;border-radius:8px;padding:8px 12px;font-size:13px;
  outline:none;font-family:inherit;resize:none;max-height:80px;
  -webkit-appearance:none;
}
.chat-input:focus{border-color:#4a90d9}
.chat-send{
  background:linear-gradient(135deg,#4a90d9,#0f3460);color:#fff;border:none;
  border-radius:8px;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;flex-shrink:0;
}
.chat-send:hover{opacity:.9}
.chat-send:disabled{opacity:.5;cursor:not-allowed}

.chat-suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px;background:#fff;flex-shrink:0}
.chat-suggestion{
  background:#e8f0fe;color:#0f3460;border:1px solid #c5dcfa;
  border-radius:12px;padding:4px 10px;font-size:11px;cursor:pointer;
  white-space:nowrap;
}
.chat-suggestion:hover{background:#d0e4fc}

@media(max-width:768px){
  .chat-panel{height:60vh;max-height:60vh}
  .chat-fab{width:48px;height:48px;font-size:22px}
}

/* ===== 已处理按钮 ===== */
.handle-btn{
  display:inline-block;padding:2px 8px;border-radius:4px;
  font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;
  border:1px solid #ddd;background:#fff;color:#666;
  transition:all .2s;
}
.handle-btn:hover{background:#f5f5f5}
.handle-btn.done{
  background:#e0f5e0;color:#2e7d32;border-color:#a5d6a7;
}
.handle-btn.done:hover{background:#d0ecd0}
.handle-info{font-size:10px;color:#888;margin-top:2px}

/* ===== 响应式 ===== */
@media(min-width:769px){
  .sidebar{-webkit-transform:translateX(0);transform:translateX(0)}
  .hamburger{display:none}
  .overlay{display:none!important}
  .main-content{margin-left:220px;padding:20px}
  .kpi-grid{grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi-value{font-size:24px}
  .chart-wrapper{height:300px}
  .detail-kpi-grid{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1025px){
  .kpi-grid{grid-template-columns:repeat(6,1fr)}
  .main-content{max-width:1200px;margin-left:220px;margin-right:auto;padding:24px}
  .kpi-card:hover{-webkit-transform:translateY(-3px);transform:translateY(-3px)}
}
@media(max-width:768px){
  .main-content{padding:12px}
  .kpi-grid{gap:8px}
  .kpi-card{padding:12px 10px}
  .kpi-value{font-size:20px}
  .chart-wrapper{height:240px}
  .topbar h1{font-size:16px}
}
</style>
</head>

</header>

<!-- 主内容 -->
<div class="main-content">

<!-- ===== 总览页 ===== -->
<div id="overviewPage">

      <div class="chart-wrapper" style="height:200px"><canvas id="chartDoughnut"></canvas></div>
    </div>
    <div class="chart-container" style="flex:1;min-width:280px">

    </div>
    <div class="chart-container" style="flex:1;min-width:280px">
      <h3>全托昨日销量分布（极坐标图）</h3>
      <div class="chart-wrapper" style="height:200px"><canvas id="chartPolar"></canvas></div>
    </div>
  </div>

  <div class="section-title">📊 图表分析</div>

  <div class="chart-container">
    <h3>POP支付金额排名</h3>
    <div class="chart-wrapper"><canvas id="chartPayRank"></canvas></div>
    <div class="chart-tip">💡 点击柱状图可跳转到该店铺详情</div>
  </div>

  <div class="chart-container">
    <h3>曝光量 vs 访客数</h3>
    <div class="chart-wrapper"><canvas id="chartExposureVisitors"></canvas></div>
    <div class="chart-tip">💡 点击柱状图可跳转到该店铺详情</div>
  </div>

  <div class="chart-container">
    <h3>广告投产比（7天）</h3>
    <div class="chart-wrapper"><canvas id="chartAdROI"></canvas></div>
    <div class="chart-tip">💡 点击柱状图可跳转到该店铺详情</div>
  </div>

  <div class="chart-container">
    <h3>全托昨日销量排名</h3>
    <div class="chart-wrapper"><canvas id="chartFullSales"></canvas></div>
    <div class="chart-tip">💡 点击柱状图可跳转到该店铺详情</div>
  </div>

  <div class="section-title">📋 POP店铺明细</div>
  <div class="table-container">
    <div class="table-scroll">
      <table id="popTable"></table>
    </div>
  </div>

  <div class="section-title">📋 全托管店铺明细</div>
  <div class="table-container">
    <div class="table-scroll">
      <table id="fullTable"></table>
    </div>
  </div>
</div>

<!-- 店铺详情页容器 -->
<div id="storeDetails"></div>

</div><!-- /main-content -->

<!-- AI聊天浮动按钮 -->
<button class="chat-fab" id="chatFab" onclick="openChat()">💬</button>

<!-- AI聊天面板 -->
<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <div>
      <div class="chat-title">🤖 AI 运营助手</div>
      <div class="chat-sub">基于店铺数据智能问答</div>
    </div>
    <button class="chat-close" onclick="closeChat()">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-suggestions" id="chatSuggestions">
    <span class="chat-suggestion" onclick="sendQuickMsg('哪个店铺支付金额最高？')">哪个店铺支付金额最高？</span>
    <span class="chat-suggestion" onclick="sendQuickMsg('哪些店铺有纠纷需要处理？')">哪些店铺有纠纷？</span>
    <span class="chat-suggestion" onclick="sendQuickMsg('广告投产比排名')">广告投产比排名</span>
    <span class="chat-suggestion" onclick="sendQuickMsg('全托昨日销量排名')">全托昨日销量排名</span>
  </div>
  <div class="chat-input-area">
    <textarea class="chat-input" id="chatInput" rows="1" placeholder="输入问题..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMsg()}"></textarea>
    <button class="chat-send" id="chatSend" onclick="sendChatMsg()">发送</button>
  </div>
</div>

// ===== 后端API配置 =====
var API_URL="https://1410774605-g9ihge6xir.ap-guangzhou.tencentscf.com/";
var handledStatus={};

function loadHandledStatus(){
  fetch(API_URL).then(function(r){return r.json()}).then(function(r){
    if(r.success){handledStatus=r.data||{};renderHandledStatus();}
  }).catch(function(e){console.log("load status failed",e)});
}

function handleBtnHtml(store,type,val){
  if(val<=0)return "";
  var key=store+"|"+type+"|"+reportDate;
  return ' <span class="handle-btn" id="btn-'+key+'" onclick="toggleHandle(\''+store+'\',\''+type+'\')">已处理</span>';
}

function singleHandleBtn(store,source,context){
  var p=popData.find(function(d){return d.store===store});
  var f=fullData.find(function(d){return d.store===store});
  var hasAbnormal=false;
  if(source==="full"){
    if(f){
      if(num(f.dispute)>0||num(f.disputeExpire)>0)hasAbnormal=true;
    }
  }else{
    if(p){
      if(num(p.dispute)>0||num(p.disputeExpire)>0||num(p.errOrder)>0||num(p.manualOrder)>0||num(p.mailErr)>0||num(p.expired)>0)hasAbnormal=true;
    }
    if(f){
      if(num(f.dispute)>0||num(f.disputeExpire)>0)hasAbnormal=true;
    }
  }
  if(!hasAbnormal)return "";
  var prefix=source==="full"?"full":"pop";
  var ctx=context==="detail"?"detail-":"";
  var key=store+"|all|"+reportDate;
  var btnId="btn-"+ctx+prefix+"-"+key;
  return ' <span class="handle-btn" id="'+btnId+'" onclick="event.preventDefault();event.stopPropagation();toggleAllHandle(\''+store+'\',\''+prefix+'\',\''+ctx+'\')" style="display:inline-block;padding:3px 10px;font-size:12px;border:1px solid #4a90d9;border-radius:6px;background:#4a90d9;color:#fff;font-weight:600;cursor:pointer;margin-left:6px;white-space:nowrap">🖱️ 标记已处理</span>';
}

function renderSingleBtnStatus(){
  Object.keys(handledStatus).forEach(function(key){
    var info=handledStatus[key];
    if(key.indexOf("|all|")===-1)return;
    var btnIds=["btn-pop-"+key,"btn-full-"+key,"btn-detail-pop-"+key,"btn-detail-full-"+key];
    btnIds.forEach(function(id){
      var btn=document.getElementById(id);
      if(btn&&info.handled){
        btn.textContent="✓ 已处理";
        btn.style.background="#2e7d32";
        btn.style.borderColor="#2e7d32";
      }
    });
  });
}

function toggleAllHandle(store,prefix,ctx){
  var key=store+"|all|"+reportDate;
  var isHandled=handledStatus[key]&&handledStatus[key].handled;
  var btnId="btn-"+(ctx||"")+prefix+"-"+key;
  var btn=document.getElementById(btnId);
  if(btn){btn.textContent="...";btn.style.opacity=0.5;}
  fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({key:key,handled:!isHandled,handler:navigator.userAgent.includes("Mobile")?"移动端":"PC端"})
  }).then(function(r){return r.json()}).then(function(r){
    if(r.success){
      handledStatus=r.data||{};
      renderSingleBtnStatus();
      if(btn){btn.style.opacity=1;}
    }
  }).catch(function(e){
    if(btn){btn.textContent="标记已处理";btn.style.opacity=1;}
    console.log("toggle failed",e);
  });
}

function renderHandledStatus(){
  Object.keys(handledStatus).forEach(function(key){
    var info=handledStatus[key];
    var btn=document.getElementById("btn-"+key);
    if(btn&&info.handled){
      btn.textContent="✓已处理";
      btn.classList.add("done");
      btn.setAttribute("title","处理人:"+info.handler+" 时间:"+info.time);
    }
  });
  renderSingleBtnStatus();
}

function toggleHandle(store,type){
  var key=store+"|"+type+"|"+reportDate;
  var isHandled=handledStatus[key]&&handledStatus[key].handled;
  var btn=document.getElementById("btn-"+key);
  if(btn){btn.textContent="...";btn.style.opacity=0.5;}
  fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({key:key,handled:!isHandled,handler:navigator.userAgent.includes("Mobile")?"移动端":"PC端"})
  }).then(function(r){return r.json()}).then(function(r){
    if(r.success){
      handledStatus=r.data||{};
      renderHandledStatus();
      if(btn){btn.style.opacity=1;}
    }
  }).catch(function(e){
    if(btn){btn.textContent="已处理";btn.style.opacity=1;}
    console.log("toggle failed",e);
  });
}

// ===== 工具函数 =====
function num(v){
  if(v===null||v===undefined||v===""||v==="-")return 0;
  var n=parseFloat(v);
  return isNaN(n)?0:n;
}
function fmtMoney(v){
  var n=num(v);
  return "¥"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtUSD(v){
  var n=num(v);
  return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtInt(v){
  var n=num(v);
  return n.toLocaleString("en-US");
}
function fmtPct(v){
  if(v===null||v===undefined||v===""||v==="-")return "0.00%";
  var n=parseFloat(v);
  if(isNaN(n))return "0.00%";
  return (n*100).toFixed(2)+"%";
}
function fmtNum(v,digits){
  var n=num(v);
  if(digits===undefined)digits=2;
  return n.toLocaleString("en-US",{minimumFractionDigits:digits,maximumFractionDigits:digits});
}
function hasPopData(s){
  var d=popData.find(function(x){return x.store===s});
  return d&&d.pay!==null;
}
function hasFullData(s){
  var d=fullData.find(function(x){return x.store===s});
  return d&&d.salesYest!==null;
}
function disputeTag(val){
  var n=num(val);
  if(n===0)return '<span class="tag tag-green">'+n+'</span>';
  return '<span class="tag tag-red">'+n+'</span>';
}
function deadStockTag(val){
  var n=num(val);
  if(n===0)return '<span class="tag tag-green">'+n+'</span>';
  return '<span class="tag tag-orange">'+n+'</span>';
}
function balanceTag(balance,ad7d){
  var b=num(balance),a=num(ad7d);
  if(a===0){return '<span class="tag tag-green">'+fmtMoney(b)+'</span>';}
  if(b>=a){return '<span class="tag tag-green">'+fmtMoney(b)+'</span>';}
  if(b>=a/2){return '<span class="tag tag-orange">'+fmtMoney(b)+'</span>';}
  return '<span class="tag tag-red">'+fmtMoney(b)+'</span>';
}
function abnormalTag(store){
  var p=popData.find(function(d){return d.store===store});
  if(p&&p.pay!==null){
    if(num(p.pay)===0&&num(p.exposure)===0&&num(p.visitors)===0){
      return ' <span class="tag tag-red">数据异常</span>';
    }
  }
  return '';
}
function abnormalTagFull(store){
  var f=fullData.find(function(d){return d.store===store});
  if(f&&f.salesYest!==null){
    if(num(f.views)===0&&num(f.visitors)===0&&num(f.cvr)===0){
      return ' <span class="tag tag-red">数据异常</span>';
    }
  }
  return '';
}
function disputeTagTri(val){
  var n=num(val);
  if(n===0)return '<span class="tag tag-green">'+n+'</span>';
  if(n===1)return '<span class="tag tag-orange">'+n+'</span>';
  return '<span class="tag tag-red">'+n+'</span>';
}
function rankBadge(rank){
  var cls=rank===1?"rank-1":rank===2?"rank-2":rank===3?"rank-3":"rank-other";
  return '<span class="rank-badge '+cls+'">'+rank+'</span>';
}

// ===== 交互逻辑 =====
function showOverview(){
  document.getElementById("overviewPage").style.display="block";
  var details=document.querySelectorAll(".store-detail");
  details.forEach(function(d){d.classList.remove("active")});
  document.querySelectorAll(".nav-item").forEach(function(n){n.classList.remove("active")});
  document.getElementById("nav-overview").classList.add("active");
  if(window.location.hash&&window.location.hash.indexOf("store-")===-1){history.replaceState(null,"",window.location.pathname);}
  else if(window.location.hash.indexOf("store-")!==-1){history.replaceState(null,"",window.location.pathname);}
  scrollToTop();
  if(window.innerWidth<=768)closeSidebar();
}

function showStore(name){
  document.getElementById("overviewPage").style.display="none";
  var details=document.querySelectorAll(".store-detail");
  details.forEach(function(d){d.classList.remove("active")});
  var el=document.getElementById("store-"+name);
  if(el)el.classList.add("active");
  document.querySelectorAll(".nav-item").forEach(function(n){n.classList.remove("active")});
  var navEl=document.getElementById("nav-"+name);
  if(navEl)navEl.classList.add("active");
  if(window.location.hash!=="#store-"+name){window.location.hash="store-"+name;}
  scrollToTop();
  if(window.innerWidth<=768)closeSidebar();
}

function showStoreByName(name){
  showStore(name);
}

function scrollToSection(id){
  var el=document.getElementById(id);
  if(!el){

function buildDataContext(){
  var lines=[];
  lines.push("当前日期："+reportDate);
  lines.push("");
  // 预计算POP排名
  var popRanked=popData.filter(function(d){return d.pay!==null}).slice().sort(function(a,b){return num(b.pay)-num(a.pay)});
  lines.push("【POP店铺数据（按支付金额降序）】");
  popRanked.forEach(function(d,i){
    lines.push("#"+(i+1)+" "+d.store+": 支付$"+num(d.pay).toFixed(2)+", 曝光"+num(d.exposure)+", 访客"+num(d.visitors)+", 点击率"+fmtPct(d.ctr)+", 订单"+num(d.orders)+", 转化率"+fmtPct(d.cvr)+", 昨日广告¥"+num(d.adYest).toFixed(2)+", 7天广告¥"+num(d.ad7d).toFixed(2)+", 昨日广告投产"+num(d.adRoiYest).toFixed(2)+", 7天广告投产"+num(d.adRoi7d).toFixed(2)+", 余额¥"+num(d.balance).toFixed(2)+", 纠纷"+num(d.dispute)+", 到期纠纷"+num(d.disputeExpire)+", 负责人:"+(d.owner||"无"));
  });
  // 无POP数据的店铺
  var popNoData=popData.filter(function(d){return d.pay===null});
  if(popNoData.length>0){
    lines.push("");
    lines.push("【仅纠纷数据的POP店铺（无POP业务）】");
    popNoData.forEach(function(d){
      lines.push(d.store+": 纠纷"+num(d.dispute)+", 负责人:"+(d.owner||"无"));
    });
  }
  lines.push("");
  // 预计算全托管排名
  var fullRanked=fullData.filter(function(d){return d.salesYest!==null}).slice().sort(function(a,b){return num(b.salesYest)-num(a.salesYest)});
  lines.push("【全托管店铺数据（按昨日销量降序）】");
  fullRanked.forEach(function(d,i){
    lines.push("#"+(i+1)+" "+d.store+": 浏览"+num(d.views)+", 访客"+num(d.visitors)+", 转化率"+fmtPct(d.cvr)+", 昨日销量"+num(d.salesYest)+", 7日销量"+num(d.sales7d)+", 纠纷"+num(d.dispute)+", 到期"+num(d.disputeExpire)+", 负责人:"+(d.owner||"无"));
  });
  lines.push("");
  // 预计算汇总
  lines.push("【汇总数据（已精确计算，请直接引用）】");
  lines.push("POP支付总额: $"+popPayTotal.toFixed(2));
  lines.push("POP总订单数: "+popOrderTotal);
  lines.push("昨日广告总花费: ¥"+adYestTotal.toFixed(2));
  lines.push("广告账号总余额: ¥"+balanceTotal.toFixed(2));
  lines.push("全托昨日总销量: "+fullYestTotal);
  lines.push("全托7日总销量: "+full7dTotal);
  lines.push("支付金额TOP3: "+popRanked[0].store+"($"+num(popRanked[0].pay).toFixed(2)+")、"+popRanked[1].store+"($"+num(popRanked[1].pay).toFixed(2)+")、"+popRanked[2].store+"($"+num(popRanked[2].pay).toFixed(2)+")");
  lines.push("全托昨日销量TOP3: "+fullRanked[0].store+"("+num(fullRanked[0].salesYest)+")、"+fullRanked[1].store+"("+num(fullRanked[1].salesYest)+")、"+fullRanked[2].store+"("+num(fullRanked[2].salesYest)+")");
  // 纠纷预警
  var disputeStores=popData.filter(function(d){return num(d.dispute)>0}).map(function(d){return d.store+"("+num(d.dispute)+"个)"});
  var fullDispute=fullData.filter(function(d){return num(d.dispute)>0}).map(function(d){return d.store+"("+num(d.dispute)+"个)"});
  lines.push("有纠纷的POP店铺: "+(disputeStores.length>0?disputeStores.join("、"):"无"));
  lines.push("有纠纷的全托店铺: "+(fullDispute.length>0?fullDispute.join("、"):"无"));
  // 到期纠纷预警
  var expireStores=popData.filter(function(d){return num(d.disputeExpire)>0}).map(function(d){return d.store+"("+num(d.disputeExpire)+"个)"});

  // 异常订单预警（注意：异常订单与纠纷是不同概念）

  var manualStores=popData.filter(function(d){return d.pay!==null&&num(d.manualOrder)>0}).map(function(d){return d.store+"("+num(d.manualOrder)+"个)"});
  var mailErrStores=popData.filter(function(d){return d.pay!==null&&num(d.mailErr)>0}).map(function(d){return d.store+"("+num(d.mailErr)+"个)"});
  var expiredStores=popData.filter(function(d){return d.pay!==null&&num(d.expired)>0}).map(function(d){return d.store+"("+num(d.expired)+"个)"});

  // 广告投产预警
  var lowRoi=popData.filter(function(d){return d.pay!==null&&num(d.ad7d)>0&&num(d.adRoi7d)<1}).map(function(d){return d.store+"(投产"+num(d.adRoi7d).toFixed(2)+")"});
  lines.push("7天广告投产<1的店铺: "+(lowRoi.length>0?lowRoi.join("、"):"无"));
  return lines.join("\n");
}

function callDeepSeek(messages,onSuccess,onError){
  var xhr=new XMLHttpRequest();
  xhr.open("POST",DEEPSEEK_API_URL,true);
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.setRequestHeader("Authorization","Bearer "+DEEPSEEK_API_KEY);
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      if(xhr.status===200){
        try{
          var resp=JSON.parse(xhr.responseText);
          var content=resp.choices&&resp.choices[0]&&resp.choices[0].message?resp.choices[0].message.content:"";
          onSuccess(content);
        }catch(e){onError("解析失败: "+e.message)}
      }else{
        onError("API错误("+xhr.status+"): "+xhr.responseText.substring(0,200));
      }
    }
  };
  xhr.send(JSON.stringify({model:"deepseek-chat",messages:messages,temperature:0.7,max_tokens:1500}));
}

function initChat(){
  addChatMsg("正在分析店铺数据，生成运营建议...","loading");
  var ctx=buildDataContext();
  var sysMsg="你是专业的电商运营分析师。以下数据已按排名排序并预计算了汇总值，请直接引用这些数据，不要自行计算。注意：纠纷数和异常订单（商品错误、人工审核、邮寄错误、过期订单）是不同的概念，不要混淆。给出简洁有力的运营建议（3-5条要点），包括：表现好的店铺、需要关注的异常（纠纷、到期纠纷、异常订单、低转化、广告投产低等）、行动建议。用中文回复，简洁专业。\n\n"+ctx;
  callDeepSeek(
    [{role:"system",content:sysMsg},{role:"user",content:"请给出今日运营建议"}],
    function(content){
      var loadingEl=document.querySelector(".chat-msg.loading");
      if(loadingEl)loadingEl.remove();
      addChatMsg(content,"ai");
      chatHistory.push({role:"system",content:sysMsg});
      chatHistory.push({role:"assistant",content:content});
    },
    function(err){
      var loadingEl=document.querySelector(".chat-msg.loading");
      if(loadingEl)loadingEl.remove();
      addChatMsg("AI连接失败: "+err+"\n你可以直接提问，我会基于数据回答。","error");
    }
  );
}

function sendChatMsg(){
  if(chatLoading)return;
  var input=document.getElementById("chatInput");
  var text=input.value.trim();
  if(!text)return;
  addChatMsg(text,"user");
  input.value="";
  input.style.height="auto";
  var loadingEl=addChatMsg("思考中...","loading");
  chatLoading=true;
  document.getElementById("chatSend").disabled=true;
  var ctx=buildDataContext();
  var msgs=[];
  if(chatHistory.length>0){
    msgs=chatHistory.slice();
    msgs.push({role:"user",content:"数据上下文:\n"+ctx+"\n\n用户问题: "+text+"\n请基于数据简洁回答。"});
  }else{
    msgs.push({role:"system",content:"你是专业的电商运营分析师，根据以下数据回答问题。\n"+ctx});
    msgs.push({role:"user",content:text});
  }
  callDeepSeek(msgs,function(content){
    loadingEl.remove();
    addChatMsg(content,"ai");
    chatHistory.push({role:"user",content:text});
    chatHistory.push({role:"assistant",content:content});
    chatLoading=false;
    document.getElementById("chatSend").disabled=false;
  },function(err){
    loadingEl.remove();
    addChatMsg("请求失败: "+err,"error");
    chatLoading=false;
    document.getElementById("chatSend").disabled=false;
  });
}

// ===== 拖动功能 =====
function makeDraggable(el,handle){
  var isDragging=false,startX=0,startY=0,origX=0,origY=0,hasMoved=false;
  function onStart(e){
    var touch=e.touches?e.touches[0]:e;
    isDragging=true;hasMoved=false;
    startX=touch.clientX;startY=touch.clientY;
    var rect=el.getBoundingClientRect();
    origX=rect.left;origY=rect.top;
    el.classList.add("dragging");
    e.preventDefault();
  }
  function onMove(e){
    if(!isDragging)return;
    var touch=e.touches?e.touches[0]:e;
    var dx=touch.clientX-startX;
    var dy=touch.clientY-startY;
    if(Math.abs(dx)>3||Math.abs(dy)>3)hasMoved=true;
    var newX=origX+dx;
    var newY=origY+dy;
    var maxX=window.innerWidth-el.offsetWidth;
    var maxY=window.innerHeight-el.offsetHeight;
    newX=Math.max(0,Math.min(newX,maxX));
    newY=Math.max(0,Math.min(newY,maxY));
    el.style.left=newX+"px";
    el.style.top=newY+"px";
    el.style.right="auto";
    el.style.bottom="auto";
    e.preventDefault();
  }
  function onEnd(){
    isDragging=false;
    el.classList.remove("dragging");
  }
  handle.addEventListener("mousedown",onStart);
  handle.addEventListener("touchstart",onStart,{passive:false});
  document.addEventListener("mousemove",onMove);
  document.addEventListener("touchmove",onMove,{passive:false});
  document.addEventListener("mouseup",onEnd);
  document.addEventListener("touchend",onEnd);
  return{hasMoved:function(){return hasMoved}};
}
